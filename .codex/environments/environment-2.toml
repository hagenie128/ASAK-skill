# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "ASAK Workspace"

[setup]
script = ""

[[actions]]
name = "전체 Git 상태"
icon = "tool"
command = '''
$repos = @("ASAK", "ASAK-Kiosk", "ASAK_Admin", "ASAK-back")

foreach ($repo in $repos) {
    $path = Join-Path $env:CODEX_WORKTREE_PATH $repo
    Write-Host "`n================ $repo ================"

    if (Test-Path (Join-Path $path ".git")) {
        git -C $path status --short --branch
    } else {
        Write-Host "Git 저장소를 찾을 수 없습니다: $path"
    }
}'''

[[actions]]
name = "전체 Diff 검사"
icon = "tool"
command = '''
$repos = @("ASAK", "ASAK-Kiosk", "ASAK_Admin", "ASAK-back")

foreach ($repo in $repos) {
    $path = Join-Path $env:CODEX_WORKTREE_PATH $repo
    Write-Host "`n================ $repo ================"

    if (Test-Path (Join-Path $path ".git")) {
        git -C $path diff --check
        git -C $path diff --stat
    }
}'''

[[actions]]
name = "Product Bible 열기"
icon = "tool"
command = "code \"$env:CODEX_WORKTREE_PATH\\ASAK\\docs\\README.md\""
